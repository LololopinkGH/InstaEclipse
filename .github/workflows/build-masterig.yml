name: Build MasterIG Module

on:
  workflow_dispatch:
  push:
    branches:
      - masterig

permissions:
  contents: read

concurrency:
  group: masterig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-24.04 runners already include the Android SDK. We deliberately do not use
      # android-actions/setup-android@v2: it currently tries to install the removed legacy
      # `tools` SDK package and fails before Gradle even starts.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build and test
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masterig-module-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
