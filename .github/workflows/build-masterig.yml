name: Build MasterIG Module

on:
  workflow_dispatch:
  push:
    branches:
      - masterig

permissions:
  contents: read

concurrency:
  group: masterig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply MasterIG phase 3 implementation
        shell: bash
        run: |
          set -euxo pipefail
          cat .masterig/phase3.patch.xz.b64.* | base64 -d | xz -d > /tmp/masterig-phase3.patch
          patch --forward --batch -p1 < /tmp/masterig-phase3.patch

      - name: Apply MasterIG phase 4 implementation
        shell: bash
        run: |
          set -euxo pipefail
          cat .masterig/phase4.patch.xz.b64.* | base64 -d | xz -d > /tmp/masterig-phase4.patch
          patch --forward --batch -p1 < /tmp/masterig-phase4.patch

      - name: Apply MasterIG phase 5 implementation
        shell: bash
        run: |
          set -euxo pipefail
          cat .masterig/phase5.patch.xz.b64.* | base64 -d | xz -d > /tmp/masterig-phase5.patch
          patch --forward --batch -p1 < /tmp/masterig-phase5.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Unit tests and build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masterig-module-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterig-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Prepare source snapshot
        shell: bash
        run: |
          rm -rf .git app/build .gradle
          tar -czf /tmp/masterig-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: masterig-source
          path: /tmp/masterig-source.tgz
          if-no-files-found: error

  android-runtime-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply MasterIG phase 3 implementation
        shell: bash
        run: |
          set -euxo pipefail
          cat .masterig/phase3.patch.xz.b64.* | base64 -d | xz -d > /tmp/masterig-phase3.patch
          patch --forward --batch -p1 < /tmp/masterig-phase3.patch

      - name: Apply MasterIG phase 4 implementation
        shell: bash
        run: |
          set -euxo pipefail
          cat .masterig/phase4.patch.xz.b64.* | base64 -d | xz -d > /tmp/masterig-phase4.patch
          patch --forward --batch -p1 < /tmp/masterig-phase4.patch

      - name: Apply MasterIG phase 5 implementation
        shell: bash
        run: |
          set -euxo pipefail
          cat .masterig/phase5.patch.xz.b64.* | base64 -d | xz -d > /tmp/masterig-phase5.patch
          patch --forward --batch -p1 < /tmp/masterig-phase5.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator runtime tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterig-android-runtime-test-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
